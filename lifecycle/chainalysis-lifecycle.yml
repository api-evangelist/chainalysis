deprecations:
  - surface: Entities API / Investigations API on api.chainalysis.com
    state: sunset
    http_status: 410
    signal: HTTP 410 Gone with a plaintext migration pointer
    body: Use reactor.chainalysis.com instead
    replacement: https://reactor.chainalysis.com
    observed: '2026-08-27'
    evidence:
      - url: https://api.chainalysis.com/api/entities/v1
        status: 410
      - url: https://api.chainalysis.com/api/investigations/v1
        status: 410
      - url: https://api.chainalysis.com/
        status: 410
    note: >-
      This is the estate's strongest lifecycle signal and it is done well: the correct
      status code for a permanent removal, plus a machine-readable pointer at the
      replacement host, applied as the host's catch-all so ANY stale path is caught. It
      also means the baseURL previously recorded in apis.yml for the Entities API pointed
      at a host that answers 410 for that product - corrected in this pass.
